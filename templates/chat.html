<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business Chat - Automação de Conversas</title>
    <link rel="preload" href="/static/recovery-logo.png" as="image">
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #161717;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        .chat-container {
            height: 100vh;
            display: flex;
            border-radius: 0;
        }
        
        /* Barra de menu lateral */
        .menu-sidebar {
            width: 60px;
            background-color: #1D1F1F;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #2a2f36;
        }
        
        .menu-counter {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: #22C063;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            z-index: 10;
            border: 2px solid #1D1F1F;
        }
        
        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .menu-icon:hover {
            background-color: #2a2f36;
            color: #f0f6fc;
        }
        
        .menu-icon.active {
            background-color: transparent;
            color: white;
        }
        
        .menu-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #1e90ff;
            margin-bottom: 20px;
        }
        
        .menu-spacer {
            flex: 1;
        }
        
        .menu-profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23f0f6fc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') center/cover;
            background-color: #8b949e;
            margin-bottom: 15px;
        }
        
        /* Sidebar de conversas */
        .conversations-sidebar {
            width: 350px;
            border-right: 1px solid #2a2f36;
            background-color: #161717;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            background-color: #161717;
            border-bottom: 1px solid #2a2f36;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        
        .conversation-item {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2f36;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .conversation-item:hover {
            background-color: #2a2f36;
        }
        
        .conversation-item.active {
            background-color: #2a2f36;
        }
        
        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22C063, #075e54);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversation-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: #f0f6fc;
        }
        
        .conversation-last-message {
            font-size: 0.9em;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .conversation-time {
            font-size: 0.8em;
            color: #8b949e;
        }
        
        .unread-count {
            background-color: #22C063;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75em;
            min-width: 18px;
            text-align: center;
        }
        
        /* Área de chat */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: url('/static/whatsapp-bg.webp') center/cover no-repeat, #161717;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 20px;
            background-color: #161717;
            border-bottom: 1px solid #2a2f36;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-contact-info h5 {
            margin: 0;
            color: #f0f6fc;
        }
        
        .chat-contact-info small {
            color: #8b949e;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
            background: url('/static/whatsapp-bg.webp') center/cover no-repeat, #161717;
            background-size: cover;
            background-attachment: fixed;
            opacity: 0.95;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }
        
        .message {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }
        
        .message.outbound {
            justify-content: flex-end;
        }
        
        .message.inbound {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.outbound .message-bubble {
            background-color: #154D37;
            color: white;
        }
        
        .message.inbound .message-bubble {
            background-color: #232626;
            color: #f0f6fc;
        }
        
        .message-content {
            margin-bottom: 4px;
        }
        
        .message-meta {
            font-size: 0.75em;
            opacity: 0.8;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        
        .message-status {
            font-size: 0.8em;
        }
        
        .message-status.sent {
            color: #8b949e;
        }
        
        .message-status.delivered {
            color: #8b949e;
        }
        
        .message-status.read {
            color: #22C063;
        }
        
        /* Input de mensagem */
        .chat-input {
            padding: 20px;
            background: transparent;
            position: fixed;
            bottom: 0;
            left: 340px;
            right: 60px;
            z-index: 100;
            max-width: calc(100vw - 420px);
            width: calc(100vw - 420px);
        }
        
        .input-group {
            display: flex;
            align-items: flex-end;
            position: relative;
            width: 100%;
            max-width: 100%;
        }
        
        .message-input {
            resize: none;
            border: none;
            border-radius: 30px;
            padding: 12px 50px 12px 20px;
            background-color: #232626;
            color: #f0f6fc;
            max-height: 120px;
            min-height: 44px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        .send-button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background-color: #22C063;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .send-button:hover {
            background-color: #1da851;
        }
        
        .send-button:disabled {
            background-color: #6b7280;
            cursor: not-allowed;
        }
        
        /* Empty state */
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            color: #8b949e;
            text-align: center;
            background-color: #161717;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        
        .empty-chat img {
            width: 250px;
            height: auto;
            margin-bottom: 1rem;
        }
        
        /* Nova conversa */
        .new-chat-section {
            padding: 20px;
            background-color: #161717;
            border-bottom: 1px solid #2a2f36;
        }
        
        .new-chat-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .phone-input {
            flex: 1;
            min-width: 0;
        }
        
        .quick-message-input {
            flex: 2;
            min-width: 0;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 20px;
            color: #8b949e;
        }
        
        /* Scrollbar customização */
        .conversations-list::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .conversations-list::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .conversations-list::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a2f36;
            border-radius: 3px;
        }
        
        .conversations-list::-webkit-scrollbar-thumb:hover,
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #3a3f46;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .menu-sidebar {
                display: none;
            }
            
            .conversations-sidebar {
                width: 100%;
                position: absolute;
                z-index: 1000;
                left: -100%;
                transition: left 0.3s ease;
            }
            
            .conversations-sidebar.show {
                left: 0;
            }
            
            .chat-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Menu Sidebar -->
        <div class="menu-sidebar">            
            <button class="menu-icon active" title="Conversas">
                <i class="fas fa-comment"></i>
                <div class="menu-counter" id="conversationsCounter">
                    0
                </div>
            </button>
            
            <button class="menu-icon" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            
            <button class="menu-icon" title="Grupos">
                <i class="fas fa-users"></i>
            </button>
            
            <button class="menu-icon" title="Contatos">
                <i class="fas fa-address-book"></i>
            </button>
            
            <div class="menu-status"></div>
            
            <div class="menu-spacer"></div>
            
            <button class="menu-icon" onclick="window.location.href='/'" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            
            <div class="menu-profile"></div>
        </div>
        
        <!-- Sidebar de Conversas -->
        <div class="conversations-sidebar">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">
                        <i class="fab fa-whatsapp text-success me-2"></i>
                        WhatsApp Business
                    </h4>
                    <div class="d-flex gap-2">
                        <a href="/" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-cog"></i>
                        </a>
                        <button class="btn btn-success btn-sm" id="refreshConversations">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Status de conexão -->
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="badge bg-secondary" id="connectionStatus">
                        <i class="fas fa-plug me-1"></i>
                        Verificando conexão...
                    </div>
                </div>
            </div>
            
            <!-- Nova conversa -->
            <div class="new-chat-section">
                <h6 class="mb-2">Nova Conversa</h6>
                <div class="mb-2">
                    <label for="phoneNumberSelect" class="form-label small">Número WhatsApp:</label>
                    <select class="form-select form-select-sm" id="phoneNumberSelect">
                        <option value="">Carregando números...</option>
                    </select>
                </div>
                <div class="new-chat-form">
                    <input type="tel" 
                           class="form-control form-control-sm phone-input" 
                           id="newChatPhone" 
                           placeholder="5511999999999">
                    <input type="text" 
                           class="form-control form-control-sm quick-message-input" 
                           id="newChatMessage" 
                           placeholder="Mensagem...">
                    <button class="btn btn-success btn-sm" id="sendNewMessage">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            
            <!-- Lista de conversas -->
            <div class="conversations-list" id="conversationsList">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Carregando conversas...</p>
                </div>
            </div>
        </div>
        
        <!-- Área de Chat -->
        <div class="chat-area">
            <!-- Header do chat -->
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="conversation-avatar" id="currentChatAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="chat-contact-info">
                    <h5 id="currentChatName">Selecione uma conversa</h5>
                    <small id="currentChatPhone"></small>
                </div>
            </div>
            
            <!-- Mensagens -->
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">
                    <img src="/static/recovery-logo.png" alt="Whatsapp Recovery IA" loading="eager">
                    <h5 style="color: #fff; font-weight: 300; font-size: 2.2rem; margin-bottom: 0.8rem;">Whatsapp Recovery IA</h5>
                    <p style="color: #fff; font-weight: bold;">Selecione uma conversa à esquerda ou inicie uma nova conversa para começar.</p>
                </div>
            </div>
            
            <!-- Input de mensagem -->
            <div class="chat-input" id="chatInput" style="display: none;">
                <div class="input-group">
                    <textarea class="message-input" 
                              id="messageInput" 
                              placeholder="Digite sua mensagem..."
                              rows="1"></textarea>
                    <button class="send-button" id="sendMessageBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class WhatsAppChat {
            constructor() {
                this.currentConversationId = null;
                this.conversations = [];
                this.messages = [];
                this.pollingInterval = null;
                
                this.init();
            }
            
            init() {
                this.bindEvents();
                this.loadConversations();
                this.loadPhoneNumbers();
                this.startPolling();
                this.checkConnectionStatus();
            }
            
            bindEvents() {
                // Enviar nova mensagem
                document.getElementById('sendNewMessage').addEventListener('click', () => {
                    this.sendNewMessage();
                });
                
                // Enviar mensagem na conversa atual
                document.getElementById('sendMessageBtn').addEventListener('click', () => {
                    this.sendMessage();
                });
                
                // Enter para enviar
                document.getElementById('messageInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                document.getElementById('newChatMessage').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.sendNewMessage();
                    }
                });
                
                // Refresh conversas
                document.getElementById('refreshConversations').addEventListener('click', () => {
                    this.loadConversations();
                });
                
                // Auto-resize textarea
                document.getElementById('messageInput').addEventListener('input', (e) => {
                    e.target.style.height = 'auto';
                    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
                });
            }
            
            async loadPhoneNumbers() {
                try {
                    const response = await fetch('/api/phone-numbers');
                    const select = document.getElementById('phoneNumberSelect');
                    
                    if (response.ok) {
                        const data = await response.json();
                        const phoneNumbers = data.phone_numbers || [];
                        
                        select.innerHTML = '';
                        
                        if (phoneNumbers.length === 0) {
                            select.innerHTML = '<option value="">Nenhum número disponível</option>';
                            return;
                        }
                        
                        phoneNumbers.forEach(phone => {
                            const option = document.createElement('option');
                            option.value = phone.id;
                            option.textContent = `${phone.display_phone_number} (${phone.quality_rating})`;
                            select.appendChild(option);
                        });
                        
                        // Selecionar o primeiro número como padrão
                        if (phoneNumbers.length > 0) {
                            select.value = phoneNumbers[0].id;
                        }
                        
                        console.log(`${phoneNumbers.length} phone numbers carregados da conexão`);
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        const errorMsg = errorData.error || 'Erro ao carregar números';
                        select.innerHTML = `<option value="">❌ ${errorMsg}</option>`;
                    }
                } catch (error) {
                    console.error('Erro ao carregar phone numbers:', error);
                    const select = document.getElementById('phoneNumberSelect');
                    select.innerHTML = '<option value="">Erro de conexão</option>';
                }
            }

            async checkConnectionStatus() {
                try {
                    const response = await fetch('/api/phone-numbers');
                    const statusEl = document.getElementById('connectionStatus');
                    
                    if (response.ok) {
                        const data = await response.json();
                        statusEl.innerHTML = '<i class="fas fa-check-circle me-1"></i>Conectado';
                        statusEl.className = 'badge bg-success';
                    } else {
                        statusEl.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>Desconectado';
                        statusEl.className = 'badge bg-warning';
                    }
                } catch (error) {
                    const statusEl = document.getElementById('connectionStatus');
                    statusEl.innerHTML = '<i class="fas fa-times-circle me-1"></i>Erro';
                    statusEl.className = 'badge bg-danger';
                }
            }
            
            async loadConversations() {
                try {
                    const response = await fetch('/api/conversations');
                    if (response.ok) {
                        const data = await response.json();
                        this.conversations = data.conversations;
                        this.renderConversations();
                    } else {
                        // ✅ SILENCIAR ERRO - Não incomodar o usuário
                        console.debug('Falha ao carregar conversas:', response.status);
                    }
                } catch (error) {
                    // ✅ SILENCIAR ERRO - Não incomodar o usuário  
                    console.debug('Erro na conexão:', error);
                }
            }
            
            renderConversations() {
                const container = document.getElementById('conversationsList');
                
                // Atualizar contador na barra lateral
                document.getElementById('conversationsCounter').textContent = this.conversations.length;
                
                if (this.conversations.length === 0) {
                    container.innerHTML = `
                        <div class="text-center p-4">
                            <i class="fas fa-comments fa-2x mb-3 text-muted"></i>
                            <p class="text-muted">Nenhuma conversa encontrada</p>
                            <small class="text-muted">Inicie uma nova conversa acima</small>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = this.conversations.map(conv => {
                    const initials = this.getInitials(conv.contact.name);
                    const time = this.formatTime(conv.last_message.created_at);
                    const isActive = conv.id === this.currentConversationId ? 'active' : '';
                    
                    return `
                        <div class="conversation-item ${isActive}" onclick="chatApp.selectConversation(${conv.id})">
                            <div class="conversation-avatar">${initials}</div>
                            <div class="conversation-info">
                                <div class="conversation-name">${conv.contact.name}</div>
                                <div class="conversation-last-message">
                                    ${conv.last_message.direction === 'outbound' ? '✓' : ''} 
                                    ${conv.last_message.content || 'Nova conversa'}
                                </div>
                            </div>
                            <div class="conversation-meta">
                                <div class="conversation-time">${time}</div>
                                ${conv.unread_count > 0 ? `<div class="unread-count">${conv.unread_count}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            selectConversation(conversationId) {
                this.currentConversationId = conversationId;
                const conversation = this.conversations.find(c => c.id === conversationId);
                
                if (!conversation) return;
                
                // ✅ INSTANTÂNEO - UI atualiza imediatamente
                this.updateChatHeader(conversation);
                
                // Verificar e atualizar elementos com segurança
                const emptyState = document.getElementById('emptyState');
                const chatContent = document.getElementById('chatContent');
                const chatHeader = document.getElementById('chatHeader');
                const chatInput = document.getElementById('chatInput');
                const chatMessages = document.getElementById('chatMessages');
                
                if (emptyState) emptyState.style.display = 'none';
                if (chatContent) chatContent.style.display = 'flex';
                if (chatHeader) chatHeader.style.display = 'flex';
                if (chatInput) chatInput.style.display = 'block';
                
                // ✅ FEEDBACK VISUAL INSTANTÂNEO
                document.querySelectorAll('.conversation-item').forEach(item => {
                    item.classList.remove('active');
                });
                event.target.closest('.conversation-item').classList.add('active');
                
                // ✅ PLACEHOLDER INSTANTÂNEO
                if (chatMessages) {
                    chatMessages.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #8b949e;">
                            <i class="fas fa-circle-notch fa-spin"></i> Carregando mensagens...
                        </div>
                    `;
                }
                
                // ✅ CARREGAR EM BACKGROUND - Sem bloquear
                requestAnimationFrame(() => this.loadMessages(conversationId, true));
            }
            
            updateChatHeader(conversation) {
                const initials = this.getInitials(conversation.contact.name);
                document.getElementById('currentChatAvatar').textContent = initials;
                document.getElementById('currentChatName').textContent = conversation.contact.name;
                document.getElementById('currentChatPhone').textContent = conversation.contact.phone_number;
            }
            
            async loadMessages(conversationId, forceScrollToBottom = false) {
                try {
                    const response = await fetch(`/api/conversations/${conversationId}/messages`);
                    if (response.ok) {
                        const data = await response.json();
                        this.messages = data.messages;
                        this.renderMessages(forceScrollToBottom);
                    }
                } catch (error) {
                    console.error('Erro ao carregar mensagens:', error);
                }
            }
            
            renderMessages(forceScrollToBottom = false) {
                const container = document.getElementById('chatMessages');
                
                if (this.messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-chat">
                            <i class="fas fa-comments"></i>
                            <h5>Conversa iniciada</h5>
                            <p>Envie a primeira mensagem para começar a conversa.</p>
                        </div>
                    `;
                    return;
                }
                
                // Salvar posição atual do scroll
                const scrollTop = container.scrollTop;
                const scrollHeight = container.scrollHeight;
                const clientHeight = container.clientHeight;
                
                // Verificar se usuário estava próximo do final (últimos 100px)
                const wasNearBottom = scrollTop >= (scrollHeight - clientHeight - 100);
                
                container.innerHTML = this.messages.map(msg => {
                    const time = this.formatTime(msg.created_at);
                    const statusIcon = this.getStatusIcon(msg.status);
                    
                    return `
                        <div class="message ${msg.direction}">
                            <div class="message-bubble">
                                <div class="message-content">${this.escapeHtml(msg.content)}</div>
                                <div class="message-meta">
                                    <span>${time}</span>
                                    ${msg.direction === 'outbound' ? `<span class="message-status ${msg.status}">${statusIcon}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Só fazer scroll automático se:
                // 1. Foi forçado (nova mensagem enviada)
                // 2. Usuário estava próximo do final (não estava vendo histórico)
                if (forceScrollToBottom || wasNearBottom) {
                    container.scrollTop = container.scrollHeight;
                }
                // Caso contrário, manter a posição de scroll do usuário
            }
            
            async sendMessage() {
                if (!this.currentConversationId) return;
                
                const input = document.getElementById('messageInput');
                const content = input.value.trim();
                
                if (!content) return;
                
                // Obter o phone number ID selecionado
                const phoneNumberSelect = document.getElementById('phoneNumberSelect');
                const phoneNumberId = phoneNumberSelect.value;
                
                if (!phoneNumberId) {
                    alert('Selecione um número WhatsApp primeiro');
                    return;
                }
                
                const sendBtn = document.getElementById('sendMessageBtn');
                sendBtn.disabled = true;
                input.disabled = true;
                
                try {
                    const response = await fetch(`/api/conversations/${this.currentConversationId}/send`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            content: content,
                            phone_number_id: phoneNumberId
                        })
                    });
                    
                    if (response.ok) {
                        await this.loadMessages(this.currentConversationId, true); // Forçar scroll para baixo após enviar mensagem
                        await this.loadConversations(); // Atualizar lista
                    } else {
                        const error = await response.json();
                        this.showError(error.error || 'Erro ao enviar mensagem');
                    }
                } catch (error) {
                    // ✅ SILENCIAR ERRO - Não incomodar o usuário
                    console.debug('Erro ao enviar mensagem:', error);
                } finally {
                    // ✅ SEMPRE LIMPAR CAMPO - Independente de erro
                    input.value = '';
                    input.style.height = 'auto';
                    sendBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                }
            }
            
            async sendNewMessage() {
                const phoneInput = document.getElementById('newChatPhone');
                const messageInput = document.getElementById('newChatMessage');
                const phoneNumberSelect = document.getElementById('phoneNumberSelect');
                
                const phone = phoneInput.value.trim();
                const message = messageInput.value.trim();
                const phoneNumberId = phoneNumberSelect.value;
                
                if (!phone || !message) {
                    this.showError('Telefone e mensagem são obrigatórios');
                    return;
                }
                
                if (!phoneNumberId) {
                    this.showError('Selecione um número WhatsApp');
                    return;
                }
                
                const sendBtn = document.getElementById('sendNewMessage');
                sendBtn.disabled = true;
                
                try {
                    const response = await fetch('/api/send-text-message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            phone_number: phone,
                            content: message,
                            phone_number_id: phoneNumberId
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        phoneInput.value = '';
                        messageInput.value = '';
                        
                        // Recarregar conversas e selecionar a nova
                        await this.loadConversations();
                        if (result.conversation_id) {
                            // selectConversation já carrega mensagens com scroll automático
                            await this.selectConversation(result.conversation_id);
                        }
                    } else {
                        const error = await response.json();
                        this.showError(error.error || 'Erro ao enviar mensagem');
                    }
                } catch (error) {
                    // ✅ SILENCIAR ERRO - Não incomodar o usuário
                    console.debug('Erro ao enviar nova mensagem:', error);
                } finally {
                    sendBtn.disabled = false;
                }
            }
            
            startPolling() {
                // Atualizar conversas a cada 5 segundos
                this.pollingInterval = setInterval(() => {
                    this.loadConversations();
                    if (this.currentConversationId) {
                        this.loadMessages(this.currentConversationId);
                    }
                }, 5000);
            }
            
            stopPolling() {
                if (this.pollingInterval) {
                    clearInterval(this.pollingInterval);
                }
            }
            
            // Utility functions
            getInitials(name) {
                if (!name) return '?';
                return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            }
            
            formatTime(dateString) {
                if (!dateString) return '';
                
                // 🇧🇷 CONVERSÃO MANUAL PARA BRASÍLIA (UTC-3)
                const date = new Date(dateString);
                
                // Subtrair 3 horas do UTC para obter horário de Brasília
                const brasiliaTime = new Date(date.getTime() - (3 * 60 * 60 * 1000));
                
                const now = new Date();
                const nowBrasilia = new Date(now.getTime() - (3 * 60 * 60 * 1000));
                
                // Verificar se é hoje (data brasileira)
                const isToday = (
                    brasiliaTime.getUTCFullYear() === nowBrasilia.getUTCFullYear() &&
                    brasiliaTime.getUTCMonth() === nowBrasilia.getUTCMonth() &&
                    brasiliaTime.getUTCDate() === nowBrasilia.getUTCDate()
                );
                
                if (isToday) {
                    // Mostrar hora:minuto no fuso brasileiro
                    const hours = brasiliaTime.getUTCHours().toString().padStart(2, '0');
                    const minutes = brasiliaTime.getUTCMinutes().toString().padStart(2, '0');
                    return `${hours}:${minutes}`;
                } else {
                    // Mostrar data brasileira
                    const day = brasiliaTime.getUTCDate().toString().padStart(2, '0');
                    const month = (brasiliaTime.getUTCMonth() + 1).toString().padStart(2, '0');
                    return `${day}/${month}`;
                }
            }
            
            getStatusIcon(status) {
                switch (status) {
                    case 'sent': return '✓';
                    case 'delivered': return '✓✓';
                    case 'read': return '✓✓';
                    case 'failed': return '⚠';
                    default: return '○';
                }
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            showError(message) {
                // ✅ SILENCIAR TODAS AS MENSAGENS DE ERRO - Não incomodar o usuário
                console.debug('Erro (silenciado):', message);
                // alert(message); // REMOVIDO - era irritante
            }
        }
        
        // Initialize chat app
        const chatApp = new WhatsAppChat();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            chatApp.stopPolling();
        });
    </script>
</body>
</html>
